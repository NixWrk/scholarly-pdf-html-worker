[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-pdf-html-worker"
version = "0.1.0"
description = "Zotero PDF to polished source HTML worker"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "NixWrk" }
]
dependencies = [
  "requests>=2.31",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
pdf-text-detect = [
  "pymupdf>=1.24",
  "pypdf>=4",
]
math = [
  "mini-racer>=0.12",
]

[project.scripts]
pdf-html-polish = "pdf_html_polish.cli.clean_convert:main"
pdf-html-polish-clean = "pdf_html_polish.cli.clean_convert:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_html_polish = ["assets/katex/*"]
