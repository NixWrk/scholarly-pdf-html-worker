[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-pdf-html-worker"
version = "0.1.0"
description = "Zotero PDF to polished source HTML worker"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "NixWrk" }
]
dependencies = [
  "Pillow>=10",
  "requests>=2.31",
  "psutil>=5.9",
  "pytest>=8",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
  "types-psutil",
  "types-requests",
]
pdf-text-detect = [
  "pymupdf>=1.24",
  "pypdf>=4",
]
math = [
  "mini-racer>=0.12",
]

[project.scripts]
pdf-html-polish = "pdf_html_polish.cli.clean_convert:main"
pdf-html-polish-clean = "pdf_html_polish.cli.clean_convert:main"
pdf-html-polish-stage-contract = "pdf_html_polish.cli.stage_contract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_html_polish = ["assets/katex/*"]

[[tool.mypy.overrides]]
# PyMuPDF exposes the import name `fitz` but does not ship a py.typed marker.
module = ["fitz", "fitz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyPDF2 is an optional legacy fallback when pypdf/PyMuPDF cannot read a file.
module = ["PyPDF2", "PyPDF2.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Compatibility facade: these imports intentionally preserve the legacy API
# while implementations move into focused raw_html_polish modules.
"src/pdf_html_polish/single_file_html.py" = ["F401"]
# Executable compatibility facades also expose imported aliases to tests and
# downstream scripts. Some bootstrap the local src tree before importing it.
"scripts/audit_en_polish.py" = ["E402", "F401"]
"scripts/audit_en_raw.py" = ["F401"]
"scripts/audit_source_language.py" = ["E402"]
"scripts/llm_quality_loop.py" = ["F401"]
